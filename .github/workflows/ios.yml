name: iOS IPA

# Builds an unsigned IPA on a GitHub-hosted Mac. Signing happens on the phone (全能签).
#   push to main        → build only (artifact), to catch breakage early
#   push tag vX.Y.Z      → build, GitHub Release, publish to apps.gugenzzz.top
#   manual run           → build; publish only if "publish" is ticked (re-publishes package.json version with force)
# Cut a release with: ./scripts/release.sh 0.3.0 "更新说明"
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths: ["app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the software source (replaces the same version)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # The release script pushes its "Release vX" commit together with the tag; build it once, via the tag.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$IS_TAG" = "true" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PKG" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match app/package.json version $PKG"; exit 1
            fi
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            NOTES=$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:subject)%0a%0a%(contents:body)' | sed '/^-----BEGIN PGP/,$d')
          else
            NOTES=$(git log -1 --format=%s)
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"
          { echo "NOTES<<__EOF__"; echo "$NOTES"; echo "__EOF__"; } >> "$GITHUB_ENV"
          echo "Building $PKG ($BUILD_NUMBER)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Pods
        working-directory: app/ios
        run: pod install

      - name: Archive (no signing)
        working-directory: app/ios
        run: |
          set -o pipefail
          WS=$(ls -d *.xcworkspace | head -1); SCHEME=${WS%.xcworkspace}
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/app.xcarchive/Products/Applications"

      - name: Package IPA
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload" && cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          PL="$APP/Info.plist"
          echo "BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL")" >> "$GITHUB_ENV"
          echo "APP_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PL")" >> "$GITHUB_ENV"
          echo "MIN_IOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PL")" >> "$GITHUB_ENV"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL")
          test "$PLIST_VERSION" = "$VERSION" || { echo "::error::Info.plist version $PLIST_VERSION != $VERSION"; exit 1; }
          IPA="$RUNNER_TEMP/Murmur-$VERSION.ipa"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$IPA" Payload)
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -la "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: Murmur-${{ env.VERSION }}-${{ github.run_number }}
          path: ${{ env.IPA }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log

      - name: GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$IPA" --title "Murmur $VERSION" --notes "$NOTES" --verify-tag

      - name: Publish to software source
        if: env.IS_TAG == 'true' || inputs.publish
        env:
          ADMIN_TOKEN: ${{ secrets.MURMUR_ADMIN_TOKEN }}
          FORCE: ${{ inputs.publish && '1' || '0' }}
        run: |
          curl -sS --fail-with-body --retry 3 -X POST https://voice.gugenzzz.top/admin/publish \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -F "ipa=@$IPA" -F "icon=@assets/icon.png" \
            -F "bundleId=$BUNDLE_ID" -F "version=$VERSION" -F "build=$BUILD_NUMBER" \
            -F "name=$APP_NAME" -F "minIos=$MIN_IOS" -F "notes=${NOTES:0:1000}" -F "force=$FORCE"
