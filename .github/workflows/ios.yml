name: iOS IPA

# Builds an unsigned IPA on a GitHub-hosted Mac and publishes it to the
# 全能签 software source (apps.gugenzzz.top). Signing happens on the phone.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes shown in the source"
        required: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Pods
        working-directory: app/ios
        run: pod install

      - name: Archive (no signing)
        working-directory: app/ios
        run: |
          set -o pipefail
          WS=$(ls -d *.xcworkspace | head -1); SCHEME=${WS%.xcworkspace}
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/app.xcarchive/Products/Applications"

      - name: Package IPA
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload" && cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          PL="$APP/Info.plist"
          echo "BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL")" >> "$GITHUB_ENV"
          echo "VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL")" >> "$GITHUB_ENV"
          echo "APP_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PL")" >> "$GITHUB_ENV"
          echo "MIN_IOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PL")" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/Murmur.ipa" Payload)
          ls -la "$RUNNER_TEMP/Murmur.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Murmur-${{ github.run_number }}
          path: ${{ runner.temp }}/Murmur.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log

      - name: Publish to software source
        env:
          ADMIN_TOKEN: ${{ secrets.MURMUR_ADMIN_TOKEN }}
          NOTES: ${{ github.event.inputs.notes || github.event.head_commit.message }}
        run: |
          curl -sf --retry 3 -X POST https://voice.gugenzzz.top/admin/publish \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -F "ipa=@$RUNNER_TEMP/Murmur.ipa" \
            -F "icon=@assets/icon.png" \
            -F "bundleId=$BUNDLE_ID" -F "version=$VERSION" -F "name=$APP_NAME" \
            -F "minIos=$MIN_IOS" -F "notes=${NOTES:0:300}"
