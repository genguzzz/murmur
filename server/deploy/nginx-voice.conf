# Murmur backend. Reached via stream SNI default route -> 127.0.0.1:8444.
server {
    listen 127.0.0.1:8444 ssl http2;
    server_name voice.gugenzzz.top;
    include /etc/nginx/conf.d/_tls-common.inc;
    client_max_body_size 200m;
    # Expo Updates assets: immutable files written once per update.
    location /updates/assets/ {
        alias /opt/voicememo/updates/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip on;
        gzip_types application/javascript application/octet-stream application/json;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name voice.gugenzzz.top;
    return 301 https://$host$request_uri;
}
